name: Build iOS IPA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: List available Xcode versions
      run: ls /Applications/ | grep Xcode

    - name: Select Xcode
      run: |
        XCODE_APP=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
        echo "Selected: $XCODE_APP"
        sudo xcode-select -s "$XCODE_APP/Contents/Developer"

    - name: Show Xcode version
      run: xcodebuild -version

    - name: Install ldid
      run: brew install ldid

    - name: Build Archive
      run: |
        xcodebuild archive \
          -project KernelPanel.xcodeproj \
          -scheme KernelPanel \
          -configuration Release \
          -sdk iphoneos \
          -arch arm64e \
          -archivePath build/KernelPanel.xcarchive \
          -destination "generic/platform=iOS" \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          DEVELOPMENT_TEAM="" \
          -allowProvisioningUpdates

    - name: Create IPA
      run: |
        mkdir -p build/Payload
        cp -r build/KernelPanel.xcarchive/Products/Applications/KernelPanel.app build/Payload/
        # Sign with ldid and entitlements
        if [ -f "KernelPanel/KernelPanel.entitlements" ]; then
          ldid -SKernelPanel/KernelPanel.entitlements build/Payload/KernelPanel.app/KernelPanel
        fi
        # Sign embedded dylibs
        for dylib in build/Payload/KernelPanel.app/Frameworks/*.dylib; do
          if [ -f "$dylib" ]; then
            ldid -S "$dylib"
          fi
        done
        cd build
        zip -r KernelPanel.ipa Payload
        rm -rf Payload

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: KernelPanel-IPA
        path: build/KernelPanel.ipa
